name: Build

# Builds every app in the monorepo:
#   macOS    apps/macos   universal .app → DMG + ZIP
#   Android  apps/mobile  release APK (installable, signed with the debug key)
#   iOS      apps/mobile  unsigned IPA, for sideloading with AltStore / SideStore / Sideloadly
# A GitHub Release with the builds and a changelog is published when either:
#   - a v* tag is pushed, or
#   - the workflow is run manually (Actions → Build → Run workflow) with "release" ticked;
#     it then creates the v<version> tag on that commit itself.
# A version with a suffix (1.2.0-alpha.1, 1.2.0-beta.2) is published as a pre-release with
# only the mobile builds, for testing from a feature branch before it is merged.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release with the builds and changelog
        type: boolean
        default: false
      version:
        description: Release version without the v (1.2.0, or 1.2.0-alpha.1 for a pre-release)
        type: string
        default: ""

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      app-version: ${{ steps.v.outputs.app-version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$EVENT" == "workflow_dispatch" && "$RELEASE" == "true" ]]; then
            VERSION="$INPUT_VERSION"
          fi
          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Version must look like 1.2.0 or 1.2.0-alpha.1 (got '$VERSION')"
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            # iOS needs a purely numeric version, so the app itself gets 1.2.0 for 1.2.0-alpha.1.
            echo "app-version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
            [[ "$VERSION" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            # iOS requires a numeric version, so untagged builds keep package.json's.
            echo "app-version=" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 ./build-app.sh

      - name: Package DMG and ZIP
        run: |
          mkdir -p out dmg
          cp -R "dist/Mi Remote.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Mi Remote" -srcfolder dmg -ov -format UDZO "out/Mi-Remote-$VERSION-macOS.dmg"
          ditto -c -k --keepParent "dist/Mi Remote.app" "out/Mi-Remote-$VERSION-macOS.zip"
          lipo -info "dist/Mi Remote.app/Contents/MacOS/MiRemote"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/macos/out/*

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_ENV: production
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set app version
        if: needs.version.outputs.app-version != ''
        run: npm pkg set version=${{ needs.version.outputs.app-version }}

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # NODE_ENV only here, where the JS is bundled: set job-wide, it would make
      # `yarn install` skip devDependencies such as tsx, which app.config.ts needs.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      # Guards against shipping without the native socket module (as v1.1.0 did, when
      # .gitignore excluded its sources): its event name only exists in the Kotlin code.
      - name: Verify MiLink native module is in the APK
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk 'classes*.dex' | grep -aq onTvFound \
            || { echo "::error::MiLink native module is missing from the APK"; exit 1; }

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Mi-Remote-$VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/out/*

  ios:
    needs: version
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_ENV: production
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set app version
        if: needs.version.outputs.app-version != ''
        run: npm pkg set version=${{ needs.version.outputs.app-version }}

      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Verify MiLink native module is linked
        run: |
          grep -q "MiLinkModule" "ios/Pods/Target Support Files/Pods-MiRemote/ExpoModulesProvider.swift" \
            || { echo "::error::MiLink native module is not linked into the iOS app"; exit 1; }

      # No Apple Developer account: build unsigned. Sideloading tools re-sign the app with the
      # user's own (free) Apple ID when installing it.
      - name: Build unsigned archive
        working-directory: apps/mobile/ios
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace MiRemote.xcworkspace \
            -scheme MiRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MiRemote.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|.*: error:)' || true
          test -d "$RUNNER_TEMP/MiRemote.xcarchive/Products/Applications/MiRemote.app"

      - name: Package IPA
        run: |
          mkdir -p out "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/MiRemote.xcarchive/Products/Applications/MiRemote.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/apps/mobile/out/Mi-Remote-$VERSION-ios-unsigned.ipa" Payload)
          ls -la out

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/mobile/out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [version, macos, android, ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags, for the release changelog

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Pre-releases test mobile changes only; the macOS build stays on the last stable release.
      - name: Drop desktop builds from a pre-release
        if: needs.version.outputs.prerelease == 'true'
        run: rm -f out/*macOS*

      # Uses the commit SHA (not the tag) so it also works on a manual run, before the tag exists.
      - name: Write release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_SHA
          {
            if [[ "$PRERELEASE" == "true" ]]; then
              echo "> [!WARNING]"
              echo "> **Pre-release for testing.** It may have bugs. Grab the latest stable release if you just want a working remote."
              echo
            fi
            echo "## Download"
            echo
            echo "| Platform | File | How to install |"
            echo "|---|---|---|"
            if [[ "$PRERELEASE" != "true" ]]; then
              echo "| macOS 14+ | \`Mi-Remote-$VERSION-macOS.dmg\` | Open it and drag **Mi Remote** to Applications |"
            fi
            echo "| Android 7+ | \`Mi-Remote-$VERSION-android.apk\` | Open it on the phone and allow installing from this source |"
            echo "| iPhone (iOS 16.4+) | \`Mi-Remote-$VERSION-ios-unsigned.ipa\` | Sideload with AltStore, SideStore or Sideloadly using your Apple ID |"
            echo
            echo "## First launch"
            echo
            if [[ "$PRERELEASE" != "true" ]]; then
              echo "- **macOS**: the app is not notarized. Open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**."
            fi
            echo "- **All platforms**: allow **Local Network** access when asked; the app needs it to find and reach the TV."
            echo "- **Mi TVs without MiLink** (newer Android TV / Google TV models): the phone apps connect through the Android TV remote service instead. The first time, the TV shows a 6-character code; type it into the app."
            echo "- **iPhone**: apps sideloaded with a free Apple ID expire after 7 days; refresh them in AltStore/SideStore, or reinstall."
            echo
            echo "See the [README](https://github.com/$GITHUB_REPOSITORY#install) for step-by-step instructions."
            echo
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
            echo
            if [[ -n "$PREV" ]]; then
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            else
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
            fi
          } > notes.md
          cat notes.md
          ls -la out

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=()
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          # --target creates the tag on this commit when it doesn't exist yet (manual run).
          gh release create "$TAG" out/* \
            --target "$GITHUB_SHA" \
            --title "Mi Remote $VERSION" \
            --notes-file notes.md \
            "${FLAGS[@]}"
